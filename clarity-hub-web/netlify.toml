[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  # Both SDKs ship pre-built CJS/ESM bundles and have a few node-specific
  # deps esbuild can't reach into; mark them external so they're loaded from
  # node_modules at runtime instead of being inlined.
  external_node_modules = ["@anthropic-ai/sdk", "openai"]

# Pretty URL for the SOP tool
[[redirects]]
  from = "/sop-brain-dump"
  to = "/sop-brain-dump.html"
  status = 200
