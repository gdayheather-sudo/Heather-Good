<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand-mark">
        <span class="logo">✦</span>
        <span class="logo-text">Social<strong>Studio</strong></span>
      </div>

      <div class="brand-switcher">
        <label>Workspace</label>
        <select id="brandFilter"></select>
      </div>

      <nav id="nav">
        <a href="#/dashboard" data-route="dashboard"><span class="ic">◎</span> Dashboard</a>
        <a href="#/composer" data-route="composer"><span class="ic">✎</span> Composer</a>
        <a href="#/pipeline" data-route="pipeline"><span class="ic">▦</span> Pipeline</a>
        <a href="#/calendar" data-route="calendar"><span class="ic">▣</span> Calendar</a>
        <a href="#/tasks" data-route="tasks"><span class="ic">✓</span> To-do</a>
        <a href="#/brands" data-route="brands"><span class="ic">❖</span> Brands</a>
      </nav>

      <div class="sidebar-foot">
        <a href="#/settings" data-route="settings" class="settings-link"><span class="ic">⚙</span> Settings</a>
        <div id="providerBadges" class="provider-badges"></div>
      </div>
    </aside>

    <main id="main">
      <div id="view"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
