# Netlify build config — the deployable app (Clarity CRM) lives in clarity-crm/.
# `base` makes Netlify install deps and build from that subdirectory.
[build]
  base = "clarity-crm"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # .env.example holds placeholder keys (e.g. sk-ant-xxxx); keep the post-build
  # secrets scanner from flagging the sample file.
  SECRETS_SCAN_OMIT_PATHS = ".env.example"

# Next.js runtime (SSR, route handlers, middleware). Netlify installs this plugin.
[[plugins]]
  package = "@netlify/plugin-nextjs"
